services:
  # 1. Laravel Backend
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server:/var/www
      # - vendor-cache:/var/www/vendor
      - ./server/storage/app/public:/var/www/public/storage # 🚀 FIX: Direct local mapping
    depends_on:
      - db
    networks:
      - app-network

  # 2. Nginx Server
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./server:/var/www
      - ./docker-conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./server/storage/app/public:/var/www/public/storage # 🚀 FIX: Match Nginx to the same local folder
    depends_on:
      - app
    networks:
      - app-network

  # 3. Database (MySQL)
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Map the internal MySQL data to a named volume
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    networks:
      - app-network

  # 4. React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - ./client/node_modules:/app/node_modules
    # user: "node"
    # 🚀 FIX: Run npm install at startup so it writes files to your host machine
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app
    networks:
      - app-network
  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    env_file:
      - ./server/.env
    # The image entrypoint natively parses environment variables passed this way!
    command: listen --forward-to nginx:80/api/stripe/webhook
    volumes:
      - stripe_config:/root/.config/stripe
    depends_on:
      - nginx
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
volumes:
  # vendor-cache:
  db-data:
  public-storage:
  stripe_config:
