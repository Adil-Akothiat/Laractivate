services:

  # 1. Laravel Backend
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-api
    restart: unless-stopped
    working_dir: /var/www
    command: ["/bin/sh", "/var/www/docker-entrypoint.sh", "php-fpm"]
    env_file:
      - ./server/.env
    volumes:
      - ./server:/var/www
      - vendor-cache:/var/www/vendor
      - ./server/storage/app/public:/var/www/public/storage # 🚀 FIX: Direct local mapping
    depends_on:
      - db
    networks:
      - app-network

  # 2. Nginx Server
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./server:/var/www
      - ./docker-conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./server/storage/app/public:/var/www/public/storage # 🚀 FIX: Match Nginx to the same local folder
    depends_on:
      - app
    networks:
      - app-network

  # 3. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Map the internal MySQL data to a named volume
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    networks:
      - app-network

  # 4. React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - node-cache:/app/node_modules
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
volumes:
  node-cache:
  vendor-cache:
  db-data:
  public-storage: